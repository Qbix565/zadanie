<!DOCTYPE html>
<head>
  <title>Sprawdzenie danych Krajkowski</title>
  <meta charset="utf-8">
</head>
<body>
  <div style="color:red;font-size:50px;">
    <script language="JavaScript">
      do {
        var liczba1_kra = prompt("wysokość=", "");
        var h_kra = parseFloat(liczba1_kra);
      }
      while (h_kra <= 0);
      do {
        var liczba1_kra = prompt("podstawę=", "");
        var a_kra = parseFloat(liczba1_kra);
      }
      while (!(a_kra > 0));
      var Pole_kra = a_kra * h_kra / 2;
      document.write("Pole=" + Pole_kra.toFixed(2) + " cm^2" + " < br > ");
    </script>
  </div>
</body>
